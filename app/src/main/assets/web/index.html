<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Salam Web Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <span style="font-size:32px;">🌐</span>
        <div>
            <h1 style="margin:0;font-size:24px;">Salam Web Server</h1>
            <p style="margin:4px 0 0;color:#8eabc9;font-size:13px;">Local Web Server Online</p>
        </div>
    </div>
    <div style="background:#0c1626;border:1px solid #1c3652;border-radius:16px;padding:20px;margin:20px 0;text-align:center;">
        <p style="color:#21f59b;font-weight:700;font-size:18px;margin:0 0 8px;">🟢 Website Online</p>
        <p style="color:#a5c2de;font-size:14px;margin:0;">The website URL is running smoothly and securely.</p>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;">
        <button onclick="location.reload()">↻ Refresh</button>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
