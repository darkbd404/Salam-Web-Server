plugins {
    id 'com.android.application'
}
android {
    namespace 'com.salam.androidwebserver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.salam.androidwebserver'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
}
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
