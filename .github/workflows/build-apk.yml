name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # CHECK PREINSTALLED ANDROID SDK
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/12.0/bin:$ANDROID_HOME/tools/bin:$PATH"

          echo "Checking SDK..."
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true

          echo "Checking sdkmanager..."
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Android SDK ready."

      # =========================================================
      # GRADLE BUILD
      # =========================================================

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
