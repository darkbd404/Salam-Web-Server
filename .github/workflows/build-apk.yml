name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Salam SIP Server v10
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="$ANDROID_SDK_ROOT"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          # Find sdkmanager
          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          # Accept licenses
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # Install required Android SDK packages
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Make gradlew executable if wrapper exists
      - name: Prepare Gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using system Gradle."
            gradle --version
          fi

      # 6. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle \
              assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      # 7. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
