name: Build Salam SIP Server v10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Salam SIP Server v10
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # IMPORTANT:
      # AGP 8.7.3 must NOT use Gradle 9.x
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Build Environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_HOME"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "======================================"
          echo "SALAM SIP SERVER V10 APK SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
