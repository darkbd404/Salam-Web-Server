name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK folders:"
          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "Platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "Platform Tools:"
          ls -la "$ANDROID_HOME/platform-tools" || true

          echo ""
          echo "Android SDK is ready."


      # ==========================================
      # GRADLE
      # ==========================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon


      # ==========================================
      # APK ARTIFACT
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
