name: Build Salam SIP Server v10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Salam SIP Server v10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: executable sdkmanager not found."
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installing required SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found."
            echo "Using system Gradle."
            gradle --version
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "================================="
          echo "APK BUILD SUCCESSFUL"
          echo "================================="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
