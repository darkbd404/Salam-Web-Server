name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT PROJECT
      # =========================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # JAVA 17
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # ANDROID SDK
      # =========================================
      # GitHub Ubuntu runner already provides
      # Android SDK. Do NOT run sdkmanager.
      # Do NOT chmod SDK files.
      # Do NOT install command line tools.

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "Android SDK check completed."


      # =========================================
      # GRADLE PERMISSION
      # =========================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # =========================================
      # BUILD APK
      # =========================================

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salam-SIP-Server-v10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
